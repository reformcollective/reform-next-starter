name: Debug Lighthouse token

on:
  pull_request:
    paths:
      - .github/workflows/debug-lighthouse-token.yml

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, blacksmith-4vcpu-ubuntu-2204]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Fingerprint LIGHTHOUSE_PAT
        env:
          T: ${{ secrets.LIGHTHOUSE_PAT }}
        run: |
          echo "length: ${#T}"
          echo "starts with github_pat_: $([[ "$T" == github_pat_* ]] && echo yes || echo no)"
          echo "contains whitespace or newline: $(printf '%s' "$T" | grep -c '[[:space:]]')"
          echo "sha256 first 8: $(printf '%s' "$T" | sha256sum | cut -c1-8)"
          echo "http status for repo: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/repos/reformcollective/lighthouse)"
          git ls-remote --heads "https://x-access-token:${T}@github.com/reformcollective/lighthouse.git" gh-pages 2>&1 | sed "s/${T}/***/g" || true

      - name: Load secrets the way the Lighthouse workflow does
        uses: oNaiPs/secrets-to-env-action@v1.5
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Fingerprint env.LIGHTHOUSE_PAT after loading
        env:
          T: ${{ env.LIGHTHOUSE_PAT }}
        run: |
          echo "length: ${#T}"
          echo "contains whitespace or newline: $(printf '%s' "$T" | grep -c '[[:space:]]')"
          echo "sha256 first 8: $(printf '%s' "$T" | sha256sum | cut -c1-8)"
          echo "http status for repo: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/repos/reformcollective/lighthouse)"

      - uses: actions/checkout@v6
        with:
          path: persist-default

      - uses: actions/checkout@v6
        with:
          path: persist-false
          persist-credentials: false

      - name: ls-remote from inside each checkout
        env:
          T: ${{ env.LIGHTHOUSE_PAT }}
        run: |
          for d in persist-default persist-false; do
            echo "== $d"
            git -C "$d" ls-remote --heads "https://x-access-token:${T}@github.com/reformcollective/lighthouse.git" gh-pages 2>&1 | sed "s/${T}/***/g"
          done
